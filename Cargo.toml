[package]
name = "saveowl"
version = "0.1.1"
edition = "2024"
description = "Windows tray app that discovers game saves from GPU-heavy sessions, snapshots them, and syncs conflict-safely."
license = "MIT"
repository = "https://example.invalid/saveowl"

[dependencies]
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ferrisetw = "1.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tao = "0.37"
toml = "0.9"
tray-icon = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
